<svg xmlns="http://www.w3.org/2000/svg" width="570" height="588" viewBox="0 0 570 588"><rect x="17.1" y="20.6" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.1" y="20.6" width="535.8" height="208.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.0" y="62.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Namorados viraram noivos.</text><text x="285.0" y="91.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Caminhando de mãos dadas, já</text><text x="285.0" y="119.3" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">não precisavam de desculpas para</text><text x="285.0" y="147.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">se acompanhar. Os planos</text><text x="285.0" y="175.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ganharam uma data, e chegamos</text><text x="285.0" y="204.2" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">à última página.</text></svg>