<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="588" viewBox="0 0 1152 588"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="1184" height="620"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="34.6" y="20.6" width="1082.9" height="109.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="34.6" y="20.6" width="1082.9" height="109.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="576.0" y="54.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Antes de existir Miguel e Lívia, existia Miguel. E existia Lívia. Cada</text><text x="576.0" y="84.3" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">um tinha seus planos, seus horários e algumas coisas que seriam</text><text x="576.0" y="113.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">organizadas na segunda-feira.</text></svg>