<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="588" viewBox="0 0 1152 588"><rect x="34.6" y="20.6" width="1082.9" height="109.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none"><rect x="34.6" y="20.6" width="1082.9" height="109.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="576.0" y="54.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Vieram outros cafés, passagens pela vizinhança e encontros que</text><text x="576.0" y="84.3" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">pareciam casuais. Aos poucos, os caminhos começaram a exigir</text><text x="576.0" y="113.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">pequenos desvios.</text></svg>