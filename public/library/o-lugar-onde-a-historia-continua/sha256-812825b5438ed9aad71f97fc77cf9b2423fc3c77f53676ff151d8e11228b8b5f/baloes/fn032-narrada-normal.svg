<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.1" y="311.9" width="535.8" height="241.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.1" y="311.9" width="535.8" height="241.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.0" y="359.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">A história continua em dezoito de</text><text x="285.0" y="386.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">abril de dois mil e vinte e sete.</text><text x="285.0" y="413.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Ricardo, este convite é para você.</text><text x="285.0" y="440.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel e Lívia seguem de mãos</text><text x="285.0" y="467.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">dadas, levando para o próximo</text><text x="285.0" y="495.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">capítulo a vida que escolheram</text><text x="285.0" y="522.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">construir juntos.</text></svg>