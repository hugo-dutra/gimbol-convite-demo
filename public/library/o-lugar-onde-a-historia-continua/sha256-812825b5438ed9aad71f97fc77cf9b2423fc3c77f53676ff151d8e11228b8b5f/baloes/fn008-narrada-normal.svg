<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="570" viewBox="0 0 1152 570"><rect x="34.6" y="20.0" width="1082.9" height="142.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none"><rect x="34.6" y="20.0" width="1082.9" height="142.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="576.0" y="57.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Os dois saíram com seus cafés. Miguel quis saber por que o final</text><text x="576.0" y="85.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">incomodara tanto, e Lívia explicou sem revelar os acontecimentos. A</text><text x="576.0" y="114.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">conversa atravessou a porta, uma esquina e o horário em que</text><text x="576.0" y="142.2" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">pretendiam ir embora.</text></svg>