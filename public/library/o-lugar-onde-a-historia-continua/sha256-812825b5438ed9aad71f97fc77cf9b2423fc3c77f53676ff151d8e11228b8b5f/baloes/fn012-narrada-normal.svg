<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.1" y="20.0" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.1" y="20.0" width="535.8" height="208.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.0" y="64.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Durante uma caminhada, o silêncio</text><text x="285.0" y="91.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ficou confortável. Miguel olhou para</text><text x="285.0" y="118.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Lívia, que percebeu e quis saber o</text><text x="285.0" y="145.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">motivo. Ele a convidou para sair no</text><text x="285.0" y="173.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">sábado, embora os dois já tivessem</text><text x="285.0" y="200.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">combinado uma saída.</text></svg>