<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="512" height="752"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="14.4" y="25.2" width="451.2" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="14.4" y="25.2" width="451.2" height="208.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="240.0" y="67.3" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Vieram outros cafés,</text><text x="240.0" y="95.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">passagens pela vizinhança e</text><text x="240.0" y="123.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">encontros que pareciam</text><text x="240.0" y="152.2" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">casuais. Aos poucos, os</text><text x="240.0" y="180.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">caminhos começaram a</text><text x="240.0" y="208.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">exigir pequenos desvios.</text></svg>