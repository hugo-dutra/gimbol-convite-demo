<svg xmlns="http://www.w3.org/2000/svg" width="570" height="588" viewBox="0 0 570 588"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="602" height="620"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="17.1" y="20.6" width="535.8" height="175.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.1" y="20.6" width="535.8" height="175.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.0" y="60.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Mas a história ainda continua.</text><text x="285.0" y="88.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel e Lívia se voltam agora</text><text x="285.0" y="116.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">para Ricardo: a próxima parte já</text><text x="285.0" y="145.2" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">está marcada, e eles querem sua</text><text x="285.0" y="173.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">presença.</text></svg>