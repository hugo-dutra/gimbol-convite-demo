<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="602" height="602"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="17.1" y="20.0" width="535.8" height="175.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.1" y="20.0" width="535.8" height="175.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.0" y="59.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel encerrou o trabalho,</text><text x="285.0" y="88.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">preparou um café e procurou as</text><text x="285.0" y="116.3" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">chaves. Elas estavam debaixo da</text><text x="285.0" y="144.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">mochila que ele havia deixado no</text><text x="285.0" y="172.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">sofá.</text></svg>