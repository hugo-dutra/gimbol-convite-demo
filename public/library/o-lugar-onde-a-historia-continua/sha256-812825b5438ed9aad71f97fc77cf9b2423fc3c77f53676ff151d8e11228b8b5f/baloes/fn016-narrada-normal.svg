<svg xmlns="http://www.w3.org/2000/svg" width="570" height="588" viewBox="0 0 570 588"><rect x="17.1" y="20.6" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.1" y="20.6" width="535.8" height="208.0" rx="12" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.0" y="65.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Vieram os dias especiais e também</text><text x="285.0" y="92.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">as terças-feiras: cozinhar juntos,</text><text x="285.0" y="119.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">dividir uma sobremesa e cochilar no</text><text x="285.0" y="146.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">meio de um filme. Na cozinha de</text><text x="285.0" y="173.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel, três copos espalhados</text><text x="285.0" y="200.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">chamaram a atenção de Lívia.</text></svg>