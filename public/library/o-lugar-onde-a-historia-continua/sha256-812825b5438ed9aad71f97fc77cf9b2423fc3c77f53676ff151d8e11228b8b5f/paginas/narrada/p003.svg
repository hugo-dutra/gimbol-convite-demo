<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="1152" height="588" viewBox="0 0 1152 588"><image href="images/de10bb338dff83fbe28119ebe070009681e2136e10f242580090745c78a177de.jpeg" x="0" y="0" width="1152" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="34.6" y="20.6" width="1082.9" height="109.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="576.0" y="54.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Vieram outros cafés, passagens pela vizinhança e encontros que</text><text x="576.0" y="84.3" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">pareciam casuais. Aos poucos, os caminhos começaram a exigir</text><text x="576.0" y="113.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">pequenos desvios.</text><rect x="2" y="2" width="1148" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/a20f0e56461f022b99a42720a2720029ca8c141f27a8fa326daac4c42ad7f24f.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="64.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Durante uma caminhada, o silêncio</text><text x="285.0" y="91.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ficou confortável. Miguel olhou para</text><text x="285.0" y="118.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Lívia, que percebeu e quis saber o</text><text x="285.0" y="145.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">motivo. Ele a convidou para sair no</text><text x="285.0" y="173.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">sábado, embora os dois já tivessem</text><text x="285.0" y="200.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">combinado uma saída.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/62373cf047e84ca7eeca0aec628b18dde1634ed858459ec0cdb5fedf422d6f62.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="62.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel explicou que queria</text><text x="285.0" y="90.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">chamar aquela saída de encontro.</text><text x="285.0" y="118.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Lívia segurou sua mão e aceitou.</text><text x="285.0" y="146.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Dar um nome àquilo resolveu uma</text><text x="285.0" y="175.2" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">dúvida e criou outras,</text><text x="285.0" y="203.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">principalmente sobre roupas.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/38c3dd914da715bfb26b112854f01681e877af9431c96c9d42bde89b846ff4de.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="175.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="59.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">No sábado, Miguel trocou de</text><text x="285.0" y="88.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">camisa e voltou à primeira. Lívia</text><text x="285.0" y="116.3" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">experimentou outra roupa diante</text><text x="285.0" y="144.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">do espelho e também acabou</text><text x="285.0" y="172.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">escolhendo a primeira opção.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/5c28badfaa7d2fa50c089f10e5181099cf8ddd97ed32e76c9145262bcf1d3b45.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="241.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="67.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Quando se encontraram, Lívia</text><text x="285.0" y="94.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ajeitou uma dobra na manga de</text><text x="285.0" y="121.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel e perguntou quantas</text><text x="285.0" y="148.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">camisas ele experimentara. Ele</text><text x="285.0" y="176.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">admitiu apenas duas. Foram</text><text x="285.0" y="203.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">quatro. A noite melhorou depois</text><text x="285.0" y="230.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">que parou de pensar na camisa.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg></svg>