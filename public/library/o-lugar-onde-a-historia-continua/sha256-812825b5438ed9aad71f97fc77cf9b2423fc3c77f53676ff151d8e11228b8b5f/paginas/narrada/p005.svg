<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/509433da3ae8c3b614743102765c7fea102793de05a104709575e20b2e629b55.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.6" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="62.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Numa noite em casa, Lívia fechou</text><text x="285.0" y="91.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">o livro e perguntou onde Miguel</text><text x="285.0" y="119.3" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">gostaria de estar dali a alguns</text><text x="285.0" y="147.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">anos. Ele já pensara no assunto,</text><text x="285.0" y="175.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">mas ainda não sabia a cidade nem</text><text x="285.0" y="204.2" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">como seria a casa.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/71f0e34604e748ec8eeb2def9bc8d901c1d1db4472d250744b3ea6c7a6de3230.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.6" width="535.8" height="241.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="68.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel segurou sua mão e explicou</text><text x="285.0" y="95.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">que queria escolher essas coisas</text><text x="285.0" y="122.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">com ela. Lívia também queria,</text><text x="285.0" y="149.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">desde que houvesse uma boa</text><text x="285.0" y="176.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">janela para ler. Entre sorrisos,</text><text x="285.0" y="203.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">aquela parte do futuro ficou</text><text x="285.0" y="230.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">decidida.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/95093a46de48815d2e449acfe8255f31fa5950229e39f3113dbe6eda6a1b5f31.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="241.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="67.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">O futuro entrou na conversa e</text><text x="285.0" y="94.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ficou. Algum tempo depois, Miguel</text><text x="285.0" y="121.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">levou Lívia de volta à livraria.</text><text x="285.0" y="148.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Sentado com o café, mexeu numa</text><text x="285.0" y="176.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">caixinha escondida no bolso. Ela</text><text x="285.0" y="203.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">percebeu seu silêncio e quis saber</text><text x="285.0" y="230.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">o que acontecera.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/3282c4ee5fb96d25cc418657a4ad943151ab3dbceece820cb3c163893006a74f.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="241.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="67.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel tentou reunir coragem para</text><text x="285.0" y="94.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">fazer uma pergunta sem revisá-la</text><text x="285.0" y="121.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">quatro vezes. Lívia pousou o café, e</text><text x="285.0" y="148.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ele segurou sua mão. Os dois</text><text x="285.0" y="176.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">recordaram a primeira conversa na</text><text x="285.0" y="203.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">fila e a pouca certeza que ele</text><text x="285.0" y="230.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">demonstrara naquela tarde.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/fd219672ee535802a6a99bbdb7e24ff9d871dfa6ffb415770f7934da6a09e533.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="142.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="58.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Desta vez, Miguel tinha certeza.</text><text x="285.0" y="85.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Abriu a caixinha com o anel e pediu</text><text x="285.0" y="113.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Lívia em casamento. Ela olhou para</text><text x="285.0" y="140.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">o anel, depois para ele, e aceitou.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/bb14c5cb972b686363e7e785a69426146f688fd7c48ab76c1bc5b093457ff63b.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="142.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="58.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Lívia o abraçou. Os cafés esfriaram</text><text x="285.0" y="85.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">na mesa. A resposta curta abriu</text><text x="285.0" y="113.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">espaço para tudo o que os dois</text><text x="285.0" y="140.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ainda construiriam juntos.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg></svg>