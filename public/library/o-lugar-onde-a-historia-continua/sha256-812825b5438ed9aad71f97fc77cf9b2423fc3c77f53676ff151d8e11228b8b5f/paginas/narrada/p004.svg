<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/e03752b79a1837324c91198943d54e0c634a2cc49683de20e9425bb36db6a8d3.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.6" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="65.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Vieram os dias especiais e também</text><text x="285.0" y="92.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">as terças-feiras: cozinhar juntos,</text><text x="285.0" y="119.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">dividir uma sobremesa e cochilar no</text><text x="285.0" y="146.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">meio de um filme. Na cozinha de</text><text x="285.0" y="173.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel, três copos espalhados</text><text x="285.0" y="200.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">chamaram a atenção de Lívia.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/2a25e31f3d5e66e39dd63120477a2542611b00083fa5834fcdf114ff0d627dd0.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.6" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="65.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel tentou justificar os copos.</text><text x="285.0" y="92.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Lívia ficou curiosa, mas ele</text><text x="285.0" y="119.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">recolheu os três e admitiu que</text><text x="285.0" y="146.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ainda elaborava a explicação. O</text><text x="285.0" y="173.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">humor dos dois também encontrava</text><text x="285.0" y="200.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">lugar nas pequenas desordens.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/fb35e399ba40acea3a034ac165287edc75ec260c3b5f3b4763922f2e02c3a34a.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="274.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="70.7" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Continuavam sendo duas pessoas.</text><text x="285.0" y="97.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Certa noite, Miguel apareceu com</text><text x="285.0" y="124.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ingredientes para o jantar, e Lívia</text><text x="285.0" y="151.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">demorou a abrir a porta. Embora</text><text x="285.0" y="178.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">estivesse livre, ela queria ficar</text><text x="285.0" y="206.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">sozinha e terminar o livro.</text><text x="285.0" y="233.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Reconheceu que deveria ter</text><text x="285.0" y="260.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">explicado isso.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/f40fcc1c77903ebc9acadef7c23a283c3be032eee9788659525f0ad8a3f94ed1.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="208.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="64.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel olhou para a sacola e</text><text x="285.0" y="91.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">reconheceu que também deveria</text><text x="285.0" y="118.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">ter perguntado antes de aparecer.</text><text x="285.0" y="145.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Propôs o jantar para o dia seguinte.</text><text x="285.0" y="173.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Lívia concordou e se ofereceu para</text><text x="285.0" y="200.1" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">preparar a sobremesa.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/39e2dacec9e2036deda3394f9f438e4b002137ae67a22f410de782c5808230c8.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="142.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="58.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">No dia seguinte, cozinharam juntos.</text><text x="285.0" y="85.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">A sobremesa preparada por Lívia</text><text x="285.0" y="113.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">mostrou que o acordo havia</text><text x="285.0" y="140.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">encontrado seu lugar na rotina.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/5d42dc3b925921b773d67aa989924c628076191db4c140c9cd4dceac279cdd48.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.0" width="535.8" height="175.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="61.8" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Depois do jantar, Lívia leu no sofá</text><text x="285.0" y="88.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">enquanto Miguel desenhou à mesa.</text><text x="285.0" y="115.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Aos poucos, aprenderam a reservar</text><text x="285.0" y="143.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">espaço para o outro e a deixar</text><text x="285.0" y="170.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">espaço quando o outro precisava.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg></svg>