="588" viewBox="0 0 570 588"><image href="images/387a624f3b6fc84ca23147546e8e7b6d5847ec5de746e6515e7dbf8692ed26db.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.1" y="20.6" width="535.8" height="175.0" rx="12" fill="#fff3ca" fill-opacity="0.5" stroke="#17202a" stroke-width="3"/><text x="285.0" y="60.4" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Mas a história ainda continua.</text><text x="285.0" y="88.6" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">Miguel e Lívia se voltam agora</text><text x="285.0" y="116.9" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">para Ricardo: a próxima parte já</text><text x="285.0" y="145.2" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">está marcada, e eles querem sua</text><text x="285.0" y="173.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="23" fill="#17202a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">presença.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="1152" height="570" viewBox="0 0 1152 570"><image href="images/53d846f88012f9ffbd1bda31851fd83348c0b2e0a07ce5a4c63d43373c1f1b58.jpeg" x="0" y="0" width="1152" height="570" preserveAspectRatio="xMidYMid slice"/><g data-editorial="c030"><text x="789.12" y="114.00" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-orde