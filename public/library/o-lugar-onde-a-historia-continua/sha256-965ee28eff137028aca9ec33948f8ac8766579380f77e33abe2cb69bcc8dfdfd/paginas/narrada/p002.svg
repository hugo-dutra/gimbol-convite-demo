<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/e1c39eb49db288bbc702af0d144e8af71d078e52a517adc7f3e396b3fbe6ecb4.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.640" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="378.440" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="58.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Uma semana depois, Lívia</text><text x="285.000" y="88.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">encontrou Miguel no mesmo</text><text x="285.000" y="117.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">lugar e brincou com a dúvida</text><text x="285.000" y="147.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">sobre a fila.</text><text x="285.000" y="416.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Desta vez ele se declarou</text><text x="285.000" y="445.680" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">oficialmente na espera, com o</text><text x="285.000" y="475.200" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pedido já escolhido.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/1ad3e80a98d0378819796f908cc564082b4a0776e046116dccb9ef5b9ee43f6e.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.640" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="401.960" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="61.840" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel reconheceu o livro que</text><text x="285.000" y="91.360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ela carregava. Lívia já tinha</text><text x="285.000" y="120.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">terminado a leitura, mas ainda</text><text x="285.000" y="150.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">tentava decidir se gostara do</text><text x="285.000" y="179.920" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">final.</text><text x="285.000" y="439.680" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Ele brincou com o tempo</text><text x="285.000" y="469.200" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">necessário para essa decisão e</text><text x="285.000" y="498.720" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">contou que ainda não havia lido.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="1152" height="570" viewBox="0 0 1152 570"><image href="images/feac258469150a42c7296b4bee40a52ae3b37c4ca7b0d3bb5f156fd06086707d.jpeg" x="0" y="0" width="1152" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="34.560" y="17.100" width="1082.880" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="576.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Os dois saíram com seus cafés. Miguel quis saber por que o final</text><text x="576.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">incomodara tanto, e Lívia explicou sem revelar os acontecimentos.</text><text x="576.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">A conversa atravessou a porta, uma esquina e o horário em que</text><text x="576.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pretendiam ir embora.</text><rect x="2" y="2" width="1148" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/afb5e15d24045f40e3f85c9843e4b6caed8e1d50826bccf5908b03106283579c.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="270.200" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="54.820" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Mais tarde, Lívia enviou uma</text><text x="285.000" y="84.340" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">foto da capa de outro livro que</text><text x="285.000" y="113.860" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">mencionara. Miguel escreveu,</text><text x="285.000" y="307.920" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">apagou e refez sua resposta. Por</text><text x="285.000" y="337.440" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">fim, avisou que agora precisaria</text><text x="285.000" y="366.960" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ler os dois livros.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/8f8aa9f8a7bf02bfe9e0bf579990103db1b3f5e7cf81da7adff87308428aa87d.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="270.200" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="472.900" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="314.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia percebeu os quatro</text><text x="285.000" y="343.920" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">minutos gastos naquela</text><text x="285.000" y="373.440" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">resposta curta e provocou</text><text x="285.000" y="402.960" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel. Ele atribuiu a demora à</text><text x="285.000" y="432.480" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">revisão editorial. Ela riu sozinha,</text><text x="285.000" y="507.380" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">enquanto ele deixou a mochila</text><text x="285.000" y="536.900" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">no chão, sorrindo para a tela.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg></svg>