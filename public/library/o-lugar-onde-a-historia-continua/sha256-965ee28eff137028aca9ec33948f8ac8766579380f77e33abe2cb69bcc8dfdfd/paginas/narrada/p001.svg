<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="1152" height="588" viewBox="0 0 1152 588"><image href="images/054fdf99c767867695c1e8b4a7320b42a4202200b6fe0e9feb8e48f0f85dc436.jpeg" x="0" y="0" width="1152" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="34.560" y="260.840" width="1082.880" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="576.000" y="298.560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Antes de existir Miguel e Lívia, existia Miguel. E existia Lívia. Cada</text><text x="576.000" y="328.080" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">um tinha seus planos, seus horários e algumas coisas que seriam</text><text x="576.000" y="357.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">organizadas na segunda-feira.</text><rect x="2" y="2" width="1148" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/a919b62e5f737308b836b639fee7f3ad9ec134a4103a4fc9cd9c8452e9b75ae5.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="190.400" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="472.900" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="228.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel encerrou o trabalho,</text><text x="285.000" y="257.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">preparou um café e procurou as</text><text x="285.000" y="287.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">chaves.</text><text x="285.000" y="507.380" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Elas estavam debaixo da mochila</text><text x="285.000" y="536.900" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">que ele havia deixado no sofá.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/9fa70de9a3436215cc6fd028dffc4828e6afb40ffa96f59cd7b4d3fe7f7d8a4d.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="304.400" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="51.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia regou uma planta, escolheu</text><text x="285.000" y="81.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">um livro e procurou os óculos.</text><text x="285.000" y="348.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Estavam sobre sua cabeça. A</text><text x="285.000" y="378.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">vida dos dois já tinha bastante</text><text x="285.000" y="407.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">coisa, inclusive objetos</text><text x="285.000" y="437.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">escondidos em lugares</text><text x="285.000" y="466.680" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">perfeitamente visíveis.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/f776381705e5218d05aa6458882a3b9144468a03f9d755002f9d695b8f63901c.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="361.400" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Naquela tarde, seus caminhos se</text><text x="285.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">cruzaram na cafeteria de uma</text><text x="285.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">livraria. Lívia perguntou se</text><text x="285.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel estava na fila.</text><text x="285.000" y="399.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Ele guardou o celular e admitiu,</text><text x="285.000" y="428.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">sem muita certeza, que</text><text x="285.000" y="458.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">tecnicamente estava.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/e8e64e231dc323e568b6838c1de27ed85c080952b5f5ca2f0a03520d410b43c5.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia sorriu e ficou ao lado dele.</text><text x="285.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Foi a primeira conversa. Nenhum</text><text x="285.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">dos dois pensou em guardar a</text><text x="285.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">data.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg></svg>