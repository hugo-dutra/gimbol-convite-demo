<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/e03752b79a1837324c91198943d54e0c634a2cc49683de20e9425bb36db6a8d3.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.640" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="319.640" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="55.360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Vieram os dias especiais e</text><text x="285.000" y="84.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">também as terças-feiras:</text><text x="285.000" y="114.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">cozinhar juntos,</text><text x="285.000" y="363.840" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">dividir uma sobremesa e cochilar</text><text x="285.000" y="393.360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">no meio de um filme. Na cozinha</text><text x="285.000" y="422.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">de Miguel, três copos</text><text x="285.000" y="452.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">espalhados chamaram a atenção</text><text x="285.000" y="481.920" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">de Lívia.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/2a25e31f3d5e66e39dd63120477a2542611b00083fa5834fcdf114ff0d627dd0.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.640" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="313.760" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="52.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel tentou justificar os</text><text x="285.000" y="81.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">copos. Lívia ficou curiosa,</text><text x="285.000" y="357.960" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">mas ele recolheu os três e</text><text x="285.000" y="387.480" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">admitiu que ainda elaborava a</text><text x="285.000" y="417.000" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">explicação. O humor dos dois</text><text x="285.000" y="446.520" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">também encontrava lugar nas</text><text x="285.000" y="476.040" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pequenas desordens.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/fb35e399ba40acea3a034ac165287edc75ec260c3b5f3b4763922f2e02c3a34a.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="334.610" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="61.300" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Continuavam sendo duas</text><text x="285.000" y="90.820" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pessoas. Certa noite, Miguel</text><text x="285.000" y="120.340" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">apareceu com ingredientes para</text><text x="285.000" y="149.860" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">o jantar, e Lívia demorou a abrir</text><text x="285.000" y="179.380" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">a porta. Embora estivesse livre,</text><text x="285.000" y="372.330" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ela queria ficar sozinha e</text><text x="285.000" y="401.850" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">terminar o livro. Reconheceu</text><text x="285.000" y="431.370" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">que deveria ter explicado isso.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/f40fcc1c77903ebc9acadef7c23a283c3be032eee9788659525f0ad8a3f94ed1.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="16.100" width="535.800" height="107.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="281.600" width="535.800" height="107.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="51.010" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Miguel olhou para a sacola e</text><text x="285.000" y="78.070" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">reconheceu que também deveria</text><text x="285.000" y="105.130" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">ter perguntado antes de aparecer.</text><text x="285.000" y="316.510" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Propôs o jantar para o dia seguinte.</text><text x="285.000" y="343.570" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Lívia concordou e se ofereceu para</text><text x="285.000" y="370.630" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">preparar a sobremesa.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/39e2dacec9e2036deda3394f9f438e4b002137ae67a22f410de782c5808230c8.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="253.100" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="436.900" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="287.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">No dia seguinte, cozinharam</text><text x="285.000" y="317.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">juntos.</text><text x="285.000" y="474.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">A sobremesa preparada por Lívia</text><text x="285.000" y="504.140" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">mostrou que o acordo havia</text><text x="285.000" y="533.660" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">encontrado seu lugar na rotina.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/5d42dc3b925921b773d67aa989924c628076191db4c140c9cd4dceac279cdd48.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="247.400" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="436.900" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="285.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Depois do jantar, Lívia leu no</text><text x="285.000" y="314.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">sofá enquanto Miguel desenhou</text><text x="285.000" y="344.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">à mesa. Aos poucos,</text><text x="285.000" y="474.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">aprenderam a reservar espaço</text><text x="285.000" y="504.140" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para o outro e a deixar espaço</text><text x="285.000" y="533.660" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">quando o outro precisava.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg></svg>