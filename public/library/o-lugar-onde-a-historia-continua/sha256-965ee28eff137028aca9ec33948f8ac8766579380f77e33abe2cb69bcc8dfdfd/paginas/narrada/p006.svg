<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/cb2de93347d6bdd76b2b3008de137c17c6d13ccead66977358f7226f1758dc97.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.640" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="325.520" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="52.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Namorados viraram noivos.</text><text x="285.000" y="81.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Caminhando de mãos dadas,</text><text x="285.000" y="366.480" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">já não precisavam de desculpas</text><text x="285.000" y="396.000" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para se acompanhar. Os planos</text><text x="285.000" y="425.520" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ganharam uma data, e</text><text x="285.000" y="455.040" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">chegamos à última página.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/387a624f3b6fc84ca23147546e8e7b6d5847ec5de746e6515e7dbf8692ed26db.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.640" width="535.800" height="44.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="325.520" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="48.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Mas a história ainda continua.</text><text x="285.000" y="366.480" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel e Lívia se voltam agora</text><text x="285.000" y="396.000" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para Ricardo: a próxima parte já</text><text x="285.000" y="425.520" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">está marcada, e eles querem sua</text><text x="285.000" y="455.040" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">presença.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="1152" height="570" viewBox="0 0 1152 570"><image href="images/53d846f88012f9ffbd1bda31851fd83348c0b2e0a07ce5a4c63d43373c1f1b58.jpeg" x="0" y="0" width="1152" height="570" preserveAspectRatio="xMidYMid slice"/><g data-editorial="c030"><text x="789.12" y="114.00" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">Ricardo,</text><text x="789.12" y="152.00" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">ficaríamos muito felizes se você</text><text x="789.12" y="190.00" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">fizesse parte desse capítulo</text><text x="789.12" y="228.00" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">importante da nossa história.</text><text x="789.12" y="266.00" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">Miguel &amp; Lívia</text><text x="789.12" y="304.00" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">18 de abril de 2027 · 16h30</text><text x="789.12" y="342.00" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">[Local do casamento]</text></g><rect x="2" y="2" width="1148" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/864eab24abcce6e253e86bc9f68ac2d5a38b0c653a32c88ccd04010c293cd00c.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="357.980" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel e Lívia ficariam muito</text><text x="285.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">felizes se Ricardo fizesse parte</text><text x="285.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">desse capítulo importante da</text><text x="285.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">história deles.</text><text x="285.000" y="398.940" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Ele acompanhou algumas</text><text x="285.000" y="428.460" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">páginas e agora está convidado</text><text x="285.000" y="457.980" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para viver a próxima junto com</text><text x="285.000" y="487.500" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">os dois.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/6a44cbc8c6d5cb32c39bce2c68f5e9154557275adfa0e162231e3b05c8a7299b.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><g data-editorial="c032"><text x="285.00" y="45.60" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">Ricardo, este convite é para você.</text><text x="285.00" y="75.60" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#40321f" stroke="#fff8e7" stroke-width="1" paint-order="stroke">Continua em 18.04.2027.</text></g><rect x="17.100" y="110.600" width="535.800" height="74.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="321.500" width="535.800" height="173.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="142.540" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">A história continua em dezoito de</text><text x="285.000" y="169.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">abril de dois mil e vinte e sete.</text><text x="285.000" y="362.350" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Ricardo, este convite é para você.</text><text x="285.000" y="389.410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Miguel e Lívia seguem de mãos</text><text x="285.000" y="416.470" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">dadas, levando para o próximo</text><text x="285.000" y="443.530" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">capítulo a vida que escolheram</text><text x="285.000" y="470.590" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">construir juntos.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg></svg>