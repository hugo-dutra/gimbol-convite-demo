<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/509433da3ae8c3b614743102765c7fea102793de05a104709575e20b2e629b55.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.640" width="535.800" height="44.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="313.760" width="535.800" height="224.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="48.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Numa noite em casa,</text><text x="285.000" y="361.200" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia fechou o livro e perguntou</text><text x="285.000" y="390.720" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">onde Miguel gostaria de estar</text><text x="285.000" y="420.240" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">dali a alguns anos. Ele já</text><text x="285.000" y="449.760" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pensara no assunto, mas ainda</text><text x="285.000" y="479.280" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">não sabia a cidade nem como</text><text x="285.000" y="508.800" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">seria a casa.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="24" width="570" height="588" viewBox="0 0 570 588"><image href="images/71f0e34604e748ec8eeb2def9bc8d901c1d1db4472d250744b3ea6c7a6de3230.jpeg" x="0" y="0" width="570" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.640" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="319.640" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="55.360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel segurou sua mão e</text><text x="285.000" y="84.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">explicou que queria escolher</text><text x="285.000" y="114.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">essas coisas com ela.</text><text x="285.000" y="360.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia também queria, desde que</text><text x="285.000" y="390.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">houvesse uma boa janela para</text><text x="285.000" y="419.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ler. Entre sorrisos, aquela parte</text><text x="285.000" y="449.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">do futuro ficou decidida.</text><rect x="2" y="2" width="566" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/95093a46de48815d2e449acfe8255f31fa5950229e39f3113dbe6eda6a1b5f31.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="384.200" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">O futuro entrou na conversa e</text><text x="285.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ficou. Algum tempo depois,</text><text x="285.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel levou Lívia de volta à</text><text x="285.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">livraria.</text><text x="285.000" y="425.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Sentado com o café, mexeu</text><text x="285.000" y="454.680" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">numa caixinha escondida no</text><text x="285.000" y="484.200" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">bolso. Ela percebeu seu silêncio</text><text x="285.000" y="513.720" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">e quis saber o que acontecera.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/3282c4ee5fb96d25cc418657a4ad943151ab3dbceece820cb3c163893006a74f.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="344.300" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel tentou reunir coragem</text><text x="285.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para fazer uma pergunta sem</text><text x="285.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">revisá-la quatro vezes. Lívia</text><text x="285.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pousou o café,</text><text x="285.000" y="385.260" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">e ele segurou sua mão. Os dois</text><text x="285.000" y="414.780" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">recordaram a primeira conversa</text><text x="285.000" y="444.300" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">na fila e a pouca certeza que ele</text><text x="285.000" y="473.820" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">demonstrara naquela tarde.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/fd219672ee535802a6a99bbdb7e24ff9d871dfa6ffb415770f7934da6a09e533.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="310.100" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="54.820" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Desta vez, Miguel tinha certeza.</text><text x="285.000" y="84.340" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Abriu a caixinha com o anel e</text><text x="285.000" y="113.860" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pediu Lívia em casamento.</text><text x="285.000" y="344.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Ela olhou para o anel, depois</text><text x="285.000" y="374.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para ele, e aceitou.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/bb14c5cb972b686363e7e785a69426146f688fd7c48ab76c1bc5b093457ff63b.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="17.100" y="17.100" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><rect x="17.100" y="293.000" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="#282025" stroke-width="3"/><text x="285.000" y="51.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia o abraçou. Os cafés</text><text x="285.000" y="81.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">esfriaram na mesa.</text><text x="285.000" y="330.720" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">A resposta curta abriu espaço</text><text x="285.000" y="360.240" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para tudo o que os dois ainda</text><text x="285.000" y="389.760" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">construiriam juntos.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg></svg>