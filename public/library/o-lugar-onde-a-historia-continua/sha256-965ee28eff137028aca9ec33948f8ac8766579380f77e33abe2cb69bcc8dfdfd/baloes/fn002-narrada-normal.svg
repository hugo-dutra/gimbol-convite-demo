<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="190.400" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="190.400" width="535.800" height="116.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="472.900" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="472.900" width="535.800" height="80.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="228.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel encerrou o trabalho,</text><text x="285.000" y="257.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">preparou um café e procurou as</text><text x="285.000" y="287.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">chaves.</text><text x="285.000" y="507.380" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Elas estavam debaixo da mochila</text><text x="285.000" y="536.900" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">que ele havia deixado no sofá.</text></svg>