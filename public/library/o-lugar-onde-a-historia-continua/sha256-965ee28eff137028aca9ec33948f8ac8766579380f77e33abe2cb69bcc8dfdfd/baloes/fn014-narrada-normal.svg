<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="253.100" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="253.100" width="535.800" height="80.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="400.900" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="400.900" width="535.800" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="287.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">No sábado, Miguel trocou de</text><text x="285.000" y="317.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">camisa e voltou à primeira.</text><text x="285.000" y="441.860" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia experimentou outra roupa</text><text x="285.000" y="471.380" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">diante do espelho e também</text><text x="285.000" y="500.900" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">acabou escolhendo a primeira</text><text x="285.000" y="530.420" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">opção.</text></svg>