<svg xmlns="http://www.w3.org/2000/svg" width="570" height="588" viewBox="0 0 570 588"><rect x="17.100" y="17.640" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="17.640" width="535.800" height="116.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="319.640" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="319.640" width="535.800" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="55.360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel segurou sua mão e</text><text x="285.000" y="84.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">explicou que queria escolher</text><text x="285.000" y="114.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">essas coisas com ela.</text><text x="285.000" y="360.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia também queria, desde que</text><text x="285.000" y="390.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">houvesse uma boa janela para</text><text x="285.000" y="419.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ler. Entre sorrisos, aquela parte</text><text x="285.000" y="449.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">do futuro ficou decidida.</text></svg>