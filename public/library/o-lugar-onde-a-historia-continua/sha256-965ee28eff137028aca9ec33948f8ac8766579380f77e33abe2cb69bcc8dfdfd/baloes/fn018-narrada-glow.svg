<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="602" height="602"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="17.100" y="17.100" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="17.100" width="535.800" height="188.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="334.610" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="334.610" width="535.800" height="116.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="61.300" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Continuavam sendo duas</text><text x="285.000" y="90.820" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pessoas. Certa noite, Miguel</text><text x="285.000" y="120.340" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">apareceu com ingredientes para</text><text x="285.000" y="149.860" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">o jantar, e Lívia demorou a abrir</text><text x="285.000" y="179.380" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">a porta. Embora estivesse livre,</text><text x="285.000" y="372.330" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ela queria ficar sozinha e</text><text x="285.000" y="401.850" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">terminar o livro. Reconheceu</text><text x="285.000" y="431.370" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">que deveria ter explicado isso.</text></svg>