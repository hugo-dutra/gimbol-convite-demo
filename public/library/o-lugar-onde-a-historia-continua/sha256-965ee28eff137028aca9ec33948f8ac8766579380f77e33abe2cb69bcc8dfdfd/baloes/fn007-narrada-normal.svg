<svg xmlns="http://www.w3.org/2000/svg" width="570" height="588" viewBox="0 0 570 588"><rect x="17.100" y="17.640" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="17.640" width="535.800" height="188.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="401.960" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="401.960" width="535.800" height="116.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="61.840" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel reconheceu o livro que</text><text x="285.000" y="91.360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ela carregava. Lívia já tinha</text><text x="285.000" y="120.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">terminado a leitura, mas ainda</text><text x="285.000" y="150.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">tentava decidir se gostara do</text><text x="285.000" y="179.920" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">final.</text><text x="285.000" y="439.680" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Ele brincou com o tempo</text><text x="285.000" y="469.200" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">necessário para essa decisão e</text><text x="285.000" y="498.720" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">contou que ainda não havia lido.</text></svg>