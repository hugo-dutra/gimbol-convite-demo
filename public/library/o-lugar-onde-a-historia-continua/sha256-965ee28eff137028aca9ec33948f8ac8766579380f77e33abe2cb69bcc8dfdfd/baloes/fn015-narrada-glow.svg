<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="602" height="602"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="17.100" y="17.100" width="535.800" height="140.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="17.100" width="535.800" height="140.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="367.100" width="535.800" height="107.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="367.100" width="535.800" height="107.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="54.980" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Quando se encontraram, Lívia</text><text x="285.000" y="82.040" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">ajeitou uma dobra na manga de</text><text x="285.000" y="109.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Miguel e perguntou quantas</text><text x="285.000" y="136.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">camisas ele experimentara.</text><text x="285.000" y="402.010" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Ele admitiu apenas duas. Foram</text><text x="285.000" y="429.070" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">quatro. A noite melhorou depois</text><text x="285.000" y="456.130" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">que parou de pensar na camisa.</text></svg>