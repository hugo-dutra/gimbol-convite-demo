<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="16.100" width="535.800" height="107.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="16.100" width="535.800" height="107.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="281.600" width="535.800" height="107.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="281.600" width="535.800" height="107.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="51.010" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Miguel olhou para a sacola e</text><text x="285.000" y="78.070" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">reconheceu que também deveria</text><text x="285.000" y="105.130" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">ter perguntado antes de aparecer.</text><text x="285.000" y="316.510" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Propôs o jantar para o dia seguinte.</text><text x="285.000" y="343.570" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Lívia concordou e se ofereceu para</text><text x="285.000" y="370.630" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">preparar a sobremesa.</text></svg>