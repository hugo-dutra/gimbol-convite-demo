<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720"><rect x="14.400" y="21.600" width="451.200" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="14.400" y="21.600" width="451.200" height="188.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="14.400" y="353.600" width="451.200" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="14.400" y="353.600" width="451.200" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="240.000" y="65.800" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Os dois saíram com seus</text><text x="240.000" y="95.320" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">cafés. Miguel quis saber</text><text x="240.000" y="124.840" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">por que o final incomodara</text><text x="240.000" y="154.360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">tanto, e Lívia explicou sem</text><text x="240.000" y="183.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">revelar os acontecimentos.</text><text x="240.000" y="394.560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">A conversa atravessou a</text><text x="240.000" y="424.080" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">porta, uma esquina e o</text><text x="240.000" y="453.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">horário em que pretendiam</text><text x="240.000" y="483.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ir embora.</text></svg>