<svg xmlns="http://www.w3.org/2000/svg" width="570" height="588" viewBox="0 0 570 588"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="602" height="620"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="17.100" y="17.640" width="535.800" height="44.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="17.640" width="535.800" height="44.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="313.760" width="535.800" height="224.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="313.760" width="535.800" height="224.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="48.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Numa noite em casa,</text><text x="285.000" y="361.200" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia fechou o livro e perguntou</text><text x="285.000" y="390.720" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">onde Miguel gostaria de estar</text><text x="285.000" y="420.240" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">dali a alguns anos. Ele já</text><text x="285.000" y="449.760" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pensara no assunto, mas ainda</text><text x="285.000" y="479.280" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">não sabia a cidade nem como</text><text x="285.000" y="508.800" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">seria a casa.</text></svg>