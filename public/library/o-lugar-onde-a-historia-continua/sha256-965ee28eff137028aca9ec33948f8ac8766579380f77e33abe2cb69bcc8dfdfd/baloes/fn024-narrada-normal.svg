<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="384.200" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="384.200" width="535.800" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">O futuro entrou na conversa e</text><text x="285.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">ficou. Algum tempo depois,</text><text x="285.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel levou Lívia de volta à</text><text x="285.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">livraria.</text><text x="285.000" y="425.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Sentado com o café, mexeu</text><text x="285.000" y="454.680" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">numa caixinha escondida no</text><text x="285.000" y="484.200" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">bolso. Ela percebeu seu silêncio</text><text x="285.000" y="513.720" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">e quis saber o que acontecera.</text></svg>