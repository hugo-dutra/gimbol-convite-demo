<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="570" viewBox="0 0 1152 570"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="1184" height="602"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="34.560" y="17.100" width="1082.880" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="34.560" y="17.100" width="1082.880" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="576.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Os dois saíram com seus cafés. Miguel quis saber por que o final</text><text x="576.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">incomodara tanto, e Lívia explicou sem revelar os acontecimentos.</text><text x="576.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">A conversa atravessou a porta, uma esquina e o horário em que</text><text x="576.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pretendiam ir embora.</text></svg>