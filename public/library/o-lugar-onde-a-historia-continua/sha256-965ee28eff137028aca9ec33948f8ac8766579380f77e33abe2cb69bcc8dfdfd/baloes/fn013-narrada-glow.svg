<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="602" height="602"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="17.100" y="16.100" width="535.800" height="107.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="16.100" width="535.800" height="107.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="332.900" width="535.800" height="107.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="332.900" width="535.800" height="107.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="51.010" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Miguel explicou que queria chamar</text><text x="285.000" y="78.070" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">aquela saída de encontro. Lívia</text><text x="285.000" y="105.130" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">segurou sua mão e aceitou.</text><text x="285.000" y="367.810" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Dar um nome àquilo resolveu uma</text><text x="285.000" y="394.870" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">dúvida e criou outras,</text><text x="285.000" y="421.930" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">principalmente sobre roupas.</text></svg>