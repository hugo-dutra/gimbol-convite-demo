humor dos dois</text><text x="285.000" y="446.520" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">também encontrava lugar nas</text><text x="285.000" y="476.040" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pequenas desordens.</text></svg>