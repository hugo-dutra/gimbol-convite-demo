<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="588" viewBox="0 0 1152 588"><rect x="34.560" y="290.240" width="1082.880" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="34.560" y="290.240" width="1082.880" height="116.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="576.000" y="327.960" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Vieram outros cafés, passagens pela vizinhança e encontros que</text><text x="576.000" y="357.480" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pareciam casuais. Aos poucos, os caminhos começaram a exigir</text><text x="576.000" y="387.000" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pequenos desvios.</text></svg>