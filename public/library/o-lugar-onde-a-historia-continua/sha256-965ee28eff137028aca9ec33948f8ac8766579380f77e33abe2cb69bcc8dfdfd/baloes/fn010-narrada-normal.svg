<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="270.200" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="270.200" width="535.800" height="188.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="472.900" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="472.900" width="535.800" height="80.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="314.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia percebeu os quatro</text><text x="285.000" y="343.920" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">minutos gastos naquela</text><text x="285.000" y="373.440" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">resposta curta e provocou</text><text x="285.000" y="402.960" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel. Ele atribuiu a demora à</text><text x="285.000" y="432.480" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">revisão editorial. Ela riu sozinha,</text><text x="285.000" y="507.380" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">enquanto ele deixou a mochila</text><text x="285.000" y="536.900" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">no chão, sorrindo para a tela.</text></svg>