<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="17.100" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="17.100" width="535.800" height="80.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="304.400" width="535.800" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="304.400" width="535.800" height="188.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="51.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia regou uma planta, escolheu</text><text x="285.000" y="81.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">um livro e procurou os óculos.</text><text x="285.000" y="348.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Estavam sobre sua cabeça. A</text><text x="285.000" y="378.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">vida dos dois já tinha bastante</text><text x="285.000" y="407.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">coisa, inclusive objetos</text><text x="285.000" y="437.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">escondidos em lugares</text><text x="285.000" y="466.680" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">perfeitamente visíveis.</text></svg>