<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="512" height="752"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="14.400" y="202.400" width="451.200" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="14.400" y="202.400" width="451.200" height="80.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="14.400" y="512.000" width="451.200" height="188.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="14.400" y="512.000" width="451.200" height="188.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="240.000" y="236.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Antes de existir Miguel e</text><text x="240.000" y="266.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Lívia, existia Miguel.</text><text x="240.000" y="556.200" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">E existia Lívia. Cada um</text><text x="240.000" y="585.720" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">tinha seus planos, seus</text><text x="240.000" y="615.240" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">horários e algumas coisas</text><text x="240.000" y="644.760" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">que seriam organizadas na</text><text x="240.000" y="674.280" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">segunda-feira.</text></svg>