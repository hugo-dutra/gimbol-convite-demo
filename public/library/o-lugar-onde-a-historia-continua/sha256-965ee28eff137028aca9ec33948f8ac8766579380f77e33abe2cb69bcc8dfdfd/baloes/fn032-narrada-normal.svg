<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="110.600" width="535.800" height="74.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="110.600" width="535.800" height="74.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="321.500" width="535.800" height="173.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="321.500" width="535.800" height="173.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="142.540" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">A história continua em dezoito de</text><text x="285.000" y="169.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">abril de dois mil e vinte e sete.</text><text x="285.000" y="362.350" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Ricardo, este convite é para você.</text><text x="285.000" y="389.410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">Miguel e Lívia seguem de mãos</text><text x="285.000" y="416.470" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">dadas, levando para o próximo</text><text x="285.000" y="443.530" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">capítulo a vida que escolheram</text><text x="285.000" y="470.590" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#282025">construir juntos.</text></svg>