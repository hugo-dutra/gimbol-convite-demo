<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="588" viewBox="0 0 1152 588"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="1184" height="620"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="34.560" y="260.840" width="1082.880" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="34.560" y="260.840" width="1082.880" height="116.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="576.000" y="298.560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Antes de existir Miguel e Lívia, existia Miguel. E existia Lívia. Cada</text><text x="576.000" y="328.080" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">um tinha seus planos, seus horários e algumas coisas que seriam</text><text x="576.000" y="357.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">organizadas na segunda-feira.</text></svg>