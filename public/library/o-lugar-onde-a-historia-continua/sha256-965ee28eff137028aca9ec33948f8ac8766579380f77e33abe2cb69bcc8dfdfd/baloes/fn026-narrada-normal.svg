<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="17.100" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="17.100" width="535.800" height="116.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="310.100" width="535.800" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="310.100" width="535.800" height="80.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="54.820" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Desta vez, Miguel tinha certeza.</text><text x="285.000" y="84.340" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Abriu a caixinha com o anel e</text><text x="285.000" y="113.860" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pediu Lívia em casamento.</text><text x="285.000" y="344.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Ela olhou para o anel, depois</text><text x="285.000" y="374.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para ele, e aceitou.</text></svg>