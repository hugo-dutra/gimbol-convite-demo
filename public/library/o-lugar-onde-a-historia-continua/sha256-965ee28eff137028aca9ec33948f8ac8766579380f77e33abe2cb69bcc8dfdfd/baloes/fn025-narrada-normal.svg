<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="344.300" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="17.100" y="344.300" width="535.800" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel tentou reunir coragem</text><text x="285.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">para fazer uma pergunta sem</text><text x="285.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">revisá-la quatro vezes. Lívia</text><text x="285.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">pousou o café,</text><text x="285.000" y="385.260" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">e ele segurou sua mão. Os dois</text><text x="285.000" y="414.780" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">recordaram a primeira conversa</text><text x="285.000" y="444.300" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">na fila e a pouca certeza que ele</text><text x="285.000" y="473.820" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">demonstrara naquela tarde.</text></svg>