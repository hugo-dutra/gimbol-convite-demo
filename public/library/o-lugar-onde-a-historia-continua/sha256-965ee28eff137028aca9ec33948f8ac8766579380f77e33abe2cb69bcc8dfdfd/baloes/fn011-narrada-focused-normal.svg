<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720"><rect x="14.400" y="353.600" width="451.200" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="14.400" y="353.600" width="451.200" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="14.400" y="618.400" width="451.200" height="80.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none"><rect x="14.400" y="618.400" width="451.200" height="80.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="240.000" y="394.560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Vieram outros cafés,</text><text x="240.000" y="424.080" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">passagens pela vizinhança</text><text x="240.000" y="453.600" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">e encontros que pareciam</text><text x="240.000" y="483.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">casuais. Aos poucos,</text><text x="240.000" y="652.880" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">os caminhos começaram a</text><text x="240.000" y="682.400" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">exigir pequenos desvios.</text></svg>