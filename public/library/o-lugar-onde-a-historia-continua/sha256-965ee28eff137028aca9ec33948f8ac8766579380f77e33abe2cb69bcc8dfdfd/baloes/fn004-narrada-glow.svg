<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="602" height="602"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="17.100" width="535.800" height="152.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><rect x="17.100" y="361.400" width="535.800" height="116.000" rx="9" fill="#fff3ca" fill-opacity="0.9" stroke="none" stroke-width="3" /><g fill="none" filter="url(#contour-glow)"><rect x="17.100" y="361.400" width="535.800" height="116.000" rx="9" fill="none" stroke="#000000" stroke-width="3" /></g><text x="285.000" y="58.060" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Naquela tarde, seus caminhos se</text><text x="285.000" y="87.580" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">cruzaram na cafeteria de uma</text><text x="285.000" y="117.100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">livraria. Lívia perguntou se</text><text x="285.000" y="146.620" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Miguel estava na fila.</text><text x="285.000" y="399.120" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">Ele guardou o celular e admitiu,</text><text x="285.000" y="428.640" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">sem muita certeza, que</text><text x="285.000" y="458.160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700" font-size="24" fill="#282025">tecnicamente estava.</text></svg>