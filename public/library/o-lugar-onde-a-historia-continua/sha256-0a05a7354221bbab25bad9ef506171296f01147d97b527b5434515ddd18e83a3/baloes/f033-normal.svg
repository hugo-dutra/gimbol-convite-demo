<svg xmlns="http://www.w3.org/2000/svg" width="570" height="588" viewBox="0 0 570 588"><rect x="14.250" y="6.000" width="502.000" height="142.000" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="none" stroke-width="3" stroke-linejoin="round" /><g fill="none"><rect x="14.250" y="6.000" width="502.000" height="142.000" rx="12" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" /></g><text x="265.250" y="44.880" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">Depois vieram os dias especiais. E</text><text x="265.250" y="71.940" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">também as terças-feiras: cozinhar</text><text x="265.250" y="99.000" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">juntos, dividir uma sobremesa,</text><text x="265.250" y="126.060" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">cochilar no meio de um filme.</text></svg>