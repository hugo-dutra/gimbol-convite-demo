<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><defs><filter id="contour-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="602" height="602"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" /><feFlood flood-color="#ffca28" result="light" /><feComposite in="light" in2="blur" operator="in" result="halo" /><feComposite in="light" in2="SourceAlpha" operator="in" result="yellow-contour" /><feMerge><feMergeNode in="halo" /><feMergeNode in="yellow-contour" /></feMerge></filter></defs><rect x="14.250" y="360.000" width="502.000" height="142.000" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="none" stroke-width="3" stroke-linejoin="round" /><g fill="none" filter="url(#contour-glow)"><rect x="14.250" y="360.000" width="502.000" height="142.000" rx="12" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" /></g><text x="265.250" y="398.880" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">No sábado, Miguel trocou de</text><text x="265.250" y="425.940" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">camisa e voltou para a primeira.</text><text x="265.250" y="453.000" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">Lívia também experimentou outra</text><text x="265.250" y="480.060" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">roupa — e voltou para a primeira.</text></svg>