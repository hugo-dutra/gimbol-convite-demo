<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570"><rect x="14.250" y="360.000" width="536.000" height="106.000" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="none" stroke-width="3" stroke-linejoin="round" /><g fill="none"><rect x="14.250" y="360.000" width="536.000" height="106.000" rx="12" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" /></g><text x="282.250" y="394.410" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">Miguel escreveu, apagou e escreveu</text><text x="282.250" y="421.470" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">outra resposta. Finalmente enviou:</text><text x="282.250" y="448.530" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">“Agora vou precisar ler os dois”.</text></svg>