<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#ffffff"/><svg x="24" y="24" width="1152" height="588" viewBox="0 0 1152 588"><image href="images/054fdf99c767867695c1e8b4a7320b42a4202200b6fe0e9feb8e48f0f85dc436.jpeg" x="0" y="0" width="1152" height="588" preserveAspectRatio="xMidYMid slice"/><rect x="28.800" y="14.700" width="484.000" height="70.000" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#000000" stroke-width="3" stroke-linejoin="round"/><text x="270.800" y="44.640" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">Antes de existir Miguel e Lívia,</text><text x="270.800" y="71.700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">existia Miguel. E existia Lívia.</text><rect x="28.800" y="261.660" width="760.000" height="70.000" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#000000" stroke-width="3" stroke-linejoin="round"/><text x="408.800" y="291.600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">Cada um com seus planos, seus horários e algumas</text><text x="408.800" y="318.660" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">coisas que seriam organizadas na segunda-feira.</text><rect x="2" y="2" width="1148" height="584" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/a919b62e5f737308b836b639fee7f3ad9ec134a4103a4fc9cd9c8452e9b75ae5.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="606" y="624" width="570" height="570" viewBox="0 0 570 570"><image href="images/9fa70de9a3436215cc6fd028dffc4828e6afb40ffa96f59cd7b4d3fe7f7d8a4d.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="14.250" y="14.250" width="536.000" height="106.000" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#000000" stroke-width="3" stroke-linejoin="round"/><text x="282.250" y="48.660" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">A vida dos dois já tinha bastante</text><text x="282.250" y="75.720" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">coisa. Inclusive objetos escondidos</text><text x="282.250" y="102.780" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">em lugares perfeitamente visíveis.</text><rect x="2" y="2" width="566" height="566" fill="none" stroke="#17202a" stroke-width="4"/></svg><svg x="24" y="1206" width="570" height="570" viewBox="0 0 570 570"><image href="images/f776381705e5218d05aa6458882a3b9144468a03f9d755002f9d695b8f63901c.jpeg" x="0" y="0" width="570" height="570" preserveAspectRatio="xMidYMid slice"/><rect x="14.250" y="14.250" width="331.000" height="142.000" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#000000" stroke-width="3" stroke-linejoin="round"/><text x="179.750" y="53.130" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">Naquela tarde, os</text><text x="179.750" y="80.190" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">caminhos se cruzaram</text><text x="179.750" y="107.250" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">na cafeteria de uma</text><text x="179.750" y="134.310" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="22" fill="#17202a">livraria.</text><path d="M 379.421,80.306 C 3